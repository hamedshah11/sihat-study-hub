<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Sihat redesign: Log in</title>
<!-- Mobile screen, fixed 390 x 844 frame. Sample data only. See ../README.md and ../DESIGN_SPEC.md. -->
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#EEF3FB;color:#0B1F3F}
a{color:#1F4FD8}a:hover{color:#163C9E}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-0.01em}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fu{animation:fu .6s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}.d6{animation-delay:.36s}.d7{animation-delay:.42s}
@keyframes ring{from{stroke-dashoffset:264}}
.ring{animation:ring 1.4s .2s cubic-bezier(.22,1,.36,1) both}
@keyframes bar{from{transform:scaleX(0)}}
.bar{transform-origin:left center;animation:bar 1.1s .3s cubic-bezier(.22,1,.36,1) both}
@keyframes col{from{transform:scaleY(0)}}
.col{transform-origin:center bottom;animation:col .9s cubic-bezier(.22,1,.36,1) both}
@keyframes flame{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.flame{display:inline-flex;animation:flame 1.8s ease-in-out infinite;transform-origin:50% 80%}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
.pop{animation:pop .5s .2s ease-out both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.float{animation:float 5s ease-in-out infinite}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.dot{animation:dot 1.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>html{background:#C9D2E3}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div id="screen" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #EEF3FB; color: #0B1F3F">

<div aria-hidden="true" style="position:absolute;top:-40px;right:-60px;width:260px;height:260px;border-radius:50%;background:#C5D6F6"></div>

  <div style="font-size:10px;font-weight:600;color:#1F4FD8;letter-spacing:.06em">FLASHCARD</div>

  <div style="margin-top:10px;height:6px;border-radius:9px;background:#DCE7FB"></div>
  <div style="margin-top:6px;height:6px;width:60%;border-radius:9px;background:#DCE7FB"></div>
</div>
<div style="position:absolute;left:24px;right:24px;top:60px;display:flex;flex-direction:column">

  <h1 class="serif fu d1" style="margin:150px 0 0;font-size:46px;line-height:1.02;color:#0B1F3F">Study smarter<br>for every <i style="color:#1F4FD8">shift.</i></h1>
  <p class="fu d2" style="margin:14px 0 0;font-size:15px;line-height:1.55;color:#5A6B88">Notes, flashcards, quizzes and a tutor for your BSN course at SIHAT.</p>
  <form onsubmit="return false" class="fu d3" style="margin-top:28px;display:flex;flex-direction:column;gap:14px">
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Email

    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Password

    <a href="#" data-note="not designed" style="align-self:flex-end;font-size:13px;font-weight:600;text-decoration:none">Forgot password?</a>
    <a href="02-home.html" style="display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;background:#1F4FD8;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:700">Log in <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </form>
  <p class="fu d4" style="margin:20px 0 0;text-align:center;font-size:14px;color:#5A6B88">New here? <a href="#" data-note="not designed" style="font-weight:600;text-decoration:none">Join with an invite code</a></p>

</div>
