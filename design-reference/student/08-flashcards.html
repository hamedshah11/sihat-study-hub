<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sihat redesign: Flashcards</title>
<!-- Mobile screen, fixed 390 x 844 frame. Sample data only. See ../README.md and ../DESIGN_SPEC.md. -->
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#EEF3FB;color:#0B1F3F}
a{color:#1F4FD8}a:hover{color:#163C9E}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-0.01em}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fu{animation:fu .6s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}.d6{animation-delay:.36s}.d7{animation-delay:.42s}
@keyframes ring{from{stroke-dashoffset:264}}
.ring{animation:ring 1.4s .2s cubic-bezier(.22,1,.36,1) both}
@keyframes bar{from{transform:scaleX(0)}}
.bar{transform-origin:left center;animation:bar 1.1s .3s cubic-bezier(.22,1,.36,1) both}
@keyframes col{from{transform:scaleY(0)}}
.col{transform-origin:center bottom;animation:col .9s cubic-bezier(.22,1,.36,1) both}
@keyframes flame{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.flame{display:inline-flex;animation:flame 1.8s ease-in-out infinite;transform-origin:50% 80%}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
.pop{animation:pop .5s .2s ease-out both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.float{animation:float 5s ease-in-out infinite}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.dot{animation:dot 1.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>html{background:#C9D2E3}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div id="screen" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #EEF3FB; color: #0B1F3F">

<div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:260px;background:#ECE6FF"></div>
<div style="position:absolute;left:20px;right:20px;top:52px;display:flex;flex-direction:column;gap:14px">
  <div class="fu" style="display:flex;align-items:center;gap:12px">
    <a href="02-home.html" aria-label="End session" style="width:44px;height:44px;border-radius:14px;background:#FFFFFF;border:1px solid #DCE4F2;color:#0B1F3F;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <div style="flex-grow:1"><div style="height:8px;border-radius:99px;background:#D9CCFF;overflow:hidden"><div class="bar" style="width:39%;height:8px;border-radius:99px;background:#6D4AE8"></div></div></div>
    <span style="font-size:13px;font-weight:700;color:#4B2DB8">7 / 18</span>
  </div>
  <div class="fu d1" style="display:flex;align-items:center;gap:8px">
    <div style="width:28px;height:28px;border-radius:9px;background:#6D4AE8;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 10h10M12 14l-3 7M12 14l3 7"/></svg></div>
    <span style="font-size:12px;font-weight:700;color:#4B2DB8;letter-spacing:.04em">THE SKELETON · A&amp;P I</span>
  </div>
  <div style="position:relative;height:470px;margin-top:6px">
    <div aria-hidden="true" style="position:absolute;left:24px;right:24px;top:24px;bottom:-24px;border-radius:28px;background:#D9CCFF"></div>
    <div aria-hidden="true" style="position:absolute;left:12px;right:12px;top:12px;bottom:-12px;border-radius:28px;background:#C4B1FB"></div>
    <section class="fu d2" style="position:absolute;inset:0;border-radius:28px;background:#FFFFFF;box-shadow:0 18px 40px rgba(109,74,232,.18);padding:26px 22px;display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:700;color:#5A6B88;letter-spacing:.08em">QUESTION</span><span style="font-size:11px;font-weight:600;color:#4B2DB8;background:#ECE6FF;padding:4px 10px;border-radius:99px">Review</span></div>
      <p class="serif" style="margin:18px 0 0;font-size:32px;line-height:1.12;color:#0B1F3F">Where are blood cells made in an adult?</p>
      <div style="margin:auto 0 0;border-top:1px dashed #D9CCFF;padding-top:18px" class="pop">
        <span style="font-size:11px;font-weight:700;color:#4B2DB8;letter-spacing:.08em">ANSWER</span>
        <p style="margin:8px 0 0;font-size:16px;line-height:1.5;font-weight:600">In red bone marrow.</p>
        <p style="margin:6px 0 0;font-size:13px;line-height:1.5;color:#5A6B88">Mainly the sternum, ribs, vertebrae and pelvis, and the ends of long bones like the femur.</p>
      </div>
    </section>
  </div>
</div>
<div class="fu d4" style="position:absolute;left:20px;right:20px;bottom:28px;display:flex;flex-direction:column;gap:10px">
  <div style="text-align:center;font-size:12px;color:#5A6B88">How well did you know it?</div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
    <button style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border-radius:16px;border:0;background:#FDECEA;color:#B42318;font:inherit"><span style="font-size:14px;font-weight:700">Again</span><span style="font-size:11px;opacity:.85">1 min</span></button>
    <button style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border-radius:16px;border:0;background:#FFF4E0;color:#8A4B00;font:inherit"><span style="font-size:14px;font-weight:700">Hard</span><span style="font-size:11px;opacity:.85">6 min</span></button>
    <button style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border-radius:16px;border:0;background:#6D4AE8;color:#FFFFFF;font:inherit"><span style="font-size:14px;font-weight:700">Good</span><span style="font-size:11px;opacity:.85">1 day</span></button>
    <button style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border-radius:16px;border:0;background:#E2F5EC;color:#0E6B47;font:inherit"><span style="font-size:14px;font-weight:700">Easy</span><span style="font-size:11px;opacity:.85">4 days</span></button>
  </div>
</div>

</div>
</body>
</html>
